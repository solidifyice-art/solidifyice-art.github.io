<style>
  :root {
    --bg: #0d1117;
    --bg-panel: #161b22;
    --bg-hover: #1f2630;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-soft: rgba(88, 166, 255, 0.12);
    --green: #3fb950;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 20px 0 12px;
    flex-wrap: wrap;
  }

  .search {
    position: relative;
    flex: 1;
    min-width: 200px;
    max-width: 320px;
  }

  .search input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 7px 10px 7px 32px;
    font-size: 13px;
    font-family: var(--sans);
    outline: none;
    transition: border-color .15s;
  }

  .search input:focus { border-color: var(--accent); }
  .search input::placeholder { color: var(--text-dim); }

  .search svg {
    position: absolute;
    left: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    fill: var(--text-dim);
    pointer-events: none;
  }

  .count { color: var(--text-dim); font-size: 13px; font-family: var(--mono); }

  nav.breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 14px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow-x: auto;
    white-space: nowrap;
  }

  nav.breadcrumb a {
    color: var(--accent);
    text-decoration: none;
  }

  nav.breadcrumb a:hover { text-decoration: underline; }
  nav.breadcrumb .sep { color: var(--text-dim); }
  nav.breadcrumb .current { color: var(--text-dim); }

  .panel {
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
  }

  th,
  td {
      overflow: hidden;
  }

  .col-name {
      width: auto;
  }

  .col-date {
      width: 168px;
      white-space: nowrap;
  }

  .col-size {
      width: 96px;
      white-space: nowrap;
  }

  .col-meta {
      width: 144px;
      white-space: nowrap;
  }

  thead th {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--text-dim);
    padding: 12px 20px;
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  th.col-size, th.col-meta, td.col-size, td.col-meta { text-align: right; }

  tbody td {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: var(--bg-hover); }

  .col-name { width: 44%; }
  .col-date { width: 26%; }
  .col-size { width: 14%; }
  .col-meta { width: 16%; }
  td.col-size, td.col-meta { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }

  .entry {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .entry .icon {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    background: var(--accent-soft);
  }

  .entry .icon svg { width: 15px; height: 15px; fill: var(--accent); }
  .entry .icon.file { background: rgba(139, 148, 158, 0.12); }
  .entry .icon.file svg { fill: var(--text-dim); }

  .entry a {
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .entry a:hover { color: var(--accent); }

  .entry .tag {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--green);
    background: rgba(63, 185, 80, 0.12);
    padding: 1px 7px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .entry .prerelease {
    font-size: 11px;
    color: #d29922;
    background: rgba(210, 153, 34, 0.12);
    padding: 1px 7px;
    border-radius: 20px;
    flex-shrink: 0;
  }

  .dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text);
    background: #21262d;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    font-family: var(--sans);
    text-decoration: none;
    transition: background .15s, border-color .15s;
    white-space: nowrap;
  }

  .dl-btn:hover {
    background: #30363d;
    border-color: #8b949e;
  }

  .dl-btn svg { width: 14px; height: 14px; fill: currentColor; }

  .state {
    padding: 48px 20px;
    text-align: center;
    color: var(--text-dim);
  }

  .state .spinner {
    width: 26px;
    height: 26px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin .7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .state h2 { font-size: 15px; color: var(--text); margin-bottom: 6px; font-weight: 600; }
  .state p { font-size: 13px; max-width: 420px; margin: 0 auto; }
  .state code {
    font-family: var(--mono);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 12px;
  }

  footer {
    margin-top: 28px;
    text-align: center;
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono);
  }

  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 640px) {
    .col-meta, td.col-meta { display: none; }
    .col-date, td.col-date { width: 120px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .search { max-width: none; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 16 16"><path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0zm-.82 4.74a6 6 0 0 0 1.07-1.07l3.04 3.04a.75.75 0 1 0 1.06-1.06l-3.04-3.04a6 6 0 0 0-1.07 1.07l-.06-.98z"/></svg>
      <input type="text" id="search" placeholder="Filter files…" autocomplete="off">
    </div>
    <div class="count" id="count"></div>
  </div>

  <nav class="breadcrumb" id="breadcrumb"></nav>

  <div class="panel" id="panel">
    <div class="state"><div class="spinner"></div><p>Loading releases…</p></div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------ *
 *  CONFIGURE THE TARGET REPO HERE                                     *
 * ------------------------------------------------------------------ */
const CONFIG = {
  owner: "solidifyice-art",
  repo:  "filestorage",
  // Optional: a personal access token raises the API rate limit.
  // Leave empty for unauthenticated use (60 req/h per IP).
  token: "",
  perPage: 50, // how many releases to fetch (max 100)
};

const apiBase = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`;
const state = { releases: [], view: "root", tag: null, filter: "" };

const $ = (id) => document.getElementById(id);

const ICONS = {
  dir:  '<svg viewBox="0 0 16 16"><path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75z"/></svg>',
  file: '<svg viewBox="0 0 16 16"><path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16h-9.5A1.75 1.75 0 0 1 2 14.25V1.75zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.75 1.75 0 0 1 9 4.25V1.5H3.75zm5.75.56v2.19c0 .138.112.25.25.25h2.19L8.5 1.75z"/></svg>',
  dl:   '<svg viewBox="0 0 16 16"><path d="M2.75 14A1.75 1.75 0 0 1 1 12.25v-2.5a.75.75 0 0 1 1.5 0v2.5c0 .138.112.25.25.25h10.5a.25.25 0 0 0 .25-.25v-2.5a.75.75 0 0 1 1.5 0v2.5A1.75 1.75 0 0 1 13.25 14H2.75z"/><path d="M7.25 7.689V2a.75.75 0 0 1 1.5 0v5.689l1.97-1.969a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 6.78a.75.75 0 1 1 1.06-1.06l1.97 1.97z"/></svg>',
};

function fmtSize(bytes) {
  if (bytes === 0 || bytes == null) return "0 B";
  const units = ["B", "KB", "MB", "GB"];
  const i = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
  return (bytes / 1024 ** i).toFixed(i === 0 ? 0 : 1) + " " + units[i];
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "2-digit" })
       + " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}

function releaseFiles(rel) {
  const tag = rel.tag_name;
  const base = `https://github.com/${CONFIG.owner}/${CONFIG.repo}/archive/refs/tags/${encodeURIComponent(tag)}`;
  const archives = [
    { name: `${tag}.tar.gz`, browser_download_url: `${base}.tar.gz`, size: null, created_at: rel.published_at || rel.created_at },
    { name: `${tag}.zip`, browser_download_url: `${base}.zip`, size: null, created_at: rel.published_at || rel.created_at },
  ];
  return archives.concat(rel.assets);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

async function gh(path) {
  const headers = { Accept: "application/vnd.github+json" };
  if (CONFIG.token) headers.Authorization = `Bearer ${CONFIG.token}`;
  const res = await fetch(`${apiBase}${path}`, { headers });
  if (!res.ok) {
    let msg = `HTTP ${res.status}`;
    try {
      const body = await res.json();
      if (body.message) msg = body.message;
      if (res.status === 403 && res.headers.get("x-ratelimit-remaining") === "0")
        msg = "API rate limit exceeded — add a token in CONFIG to raise it.";
    } catch (_) {}
    throw new Error(msg);
  }
  return res.json();
}

function renderBreadcrumb() {
  let html = `<a href="#" data-nav="root">/</a>`;
  if (state.view === "release") {
    html += `<a href="#" data-nav="root">file storage</a><span class="sep">/</span>`
          + `<span class="current">${esc(state.tag)}</span>`;
  } else {
    html += `<span class="current">file storage</span>`;
  }
  $("breadcrumb").innerHTML = html;
  $("breadcrumb").querySelectorAll("a").forEach(a => {
    a.onclick = (e) => { e.preventDefault(); goRoot(); };
  });
}

function render() {
  renderBreadcrumb();
  const panel = $("panel");
  const q = state.filter.toLowerCase();

  if (state.view === "root") {
    const items = state.releases.filter(r =>
      !q || r.tag_name.toLowerCase().includes(q) ||
      (r.name || "").toLowerCase().includes(q));
    $("count").textContent = `${items.length} dir${items.length === 1 ? "" : "s"}`;

    if (!items.length) return void (panel.innerHTML = emptyState("No releases match your filter."));

    let rows = parentRow();
    for (const r of items) {
      const files = releaseFiles(r);
      const total = files.reduce((s, a) => s + (a.size ?? 0), 0);
      const badges =
        (r.prerelease ? '<span class="prerelease">pre-release</span>' : "")
        + (r.draft ? '<span class="prerelease">draft</span>' : "");
      rows += `<tr>
        <td class="col-name"><div class="entry">
          <span class="icon">${ICONS.dir}</span>
          <a href="#" data-tag="${esc(r.tag_name)}">${esc(r.tag_name)}/</a>
          ${r.name && r.name !== r.tag_name ? `<span class="tag">${esc(r.name)}</span>` : ""}
          ${badges}
        </div></td>
        <td class="col-date">${fmtDate(r.published_at || r.created_at)}</td>
        <td class="col-size">${files.length} file${files.length === 1 ? "" : "s"}</td>
        <td class="col-meta">${fmtSize(total)}</td>
      </tr>`;
    }
    panel.innerHTML = tableHead("Name", "Last modified", "Files", "Size") + rows;
    panel.querySelectorAll("[data-tag]").forEach(a => {
      a.onclick = (e) => { e.preventDefault(); goRelease(a.dataset.tag); };
    });
  } else {
    const rel = state.releases.find(r => r.tag_name === state.tag);
    if (!rel) return;
    const items = releaseFiles(rel).filter(a => !q || a.name.toLowerCase().includes(q));
    $("count").textContent = `${items.length} file${items.length === 1 ? "" : "s"}`;

    if (!items.length) return void (panel.innerHTML = emptyState("No files match your filter."));

    let rows = parentRow();
    for (const a of items) {
      rows += `<tr>
        <td class="col-name"><div class="entry">
          <span class="icon file">${ICONS.file}</span>
          <a href="${esc(a.browser_download_url)}" download title="${esc(a.name)}">${esc(a.name)}</a>
        </div></td>
        <td class="col-date">${fmtDate(a.created_at)}</td>
        <td class="col-size">${a.size == null ? "—" : fmtSize(a.size)}</td>
        <td class="col-meta">
          <a class="dl-btn" href="${esc(a.browser_download_url)}" download>
            ${ICONS.dl} Download
          </a>
        </td>
      </tr>`;
    }
    panel.innerHTML = tableHead("Name", "Last modified", "Size", "") + rows;
  }
}

function tableHead(...cols) {
  return `<table><thead><tr>${cols.map(c => {
    if (c === "Name")
      return `<th class="col-name">${c}</th>`;
    if (c === "Last modified")
      return `<th class="col-date">${c}</th>`;
    if (c === "Files" || c === "Size")
      return `<th class="col-size">${c}</th>`;
    return `<th class="col-meta">${c}</th>`;
  }).join("")}</tr></thead><tbody>`;
}

function parentRow() {
  return `<tr>
    <td class="col-name"><div class="entry">
      <span class="icon">${ICONS.dir}</span>
      <a href="#" data-nav="root">../</a>
    </div></td>
    <td class="col-date">—</td>
    <td class="col-size">—</td>
    <td class="col-meta">—</td>
  </tr>`;
}

function emptyState(msg) {
  return `<div class="state"><h2>Nothing here</h2><p>${esc(msg)}</p></div>`;
}

function errorState(msg) {
  return `<div class="state">
    <h2>Could not load releases</h2>
    <p>${esc(msg)}</p>
    <p style="margin-top:10px">Check that <code>${esc(CONFIG.owner)}/${esc(CONFIG.repo)}</code>
    exists and has releases, and adjust <code>CONFIG</code> at the top of this file.</p>
  </div>`;
}

function goRoot() {
  state.view = "root";
  state.tag = null;
  $("search").value = "";
  state.filter = "";
  location.hash = "";
  render();
}

function goRelease(tag) {
  state.view = "release";
  state.tag = tag;
  $("search").value = "";
  state.filter = "";
  location.hash = encodeURIComponent(tag);
  render();
}

$("search").addEventListener("input", (e) => {
  state.filter = e.target.value.trim();
  render();
});

window.addEventListener("hashchange", () => {
  const tag = decodeURIComponent(location.hash.slice(1));
  if (tag && state.releases.some(r => r.tag_name === tag)) {
    state.view = "release";
    state.tag = tag;
    render();
  } else if (!tag && state.view !== "root") {
    goRoot();
  }
});

(async function init() {
  try {
    const releases = await gh(`/releases?per_page=${CONFIG.perPage}`);
    state.releases = releases;
    const tag = decodeURIComponent(location.hash.slice(1));
    if (tag && releases.some(r => r.tag_name === tag)) {
      state.view = "release";
      state.tag = tag;
    }
    render();
  } catch (err) {
    $("panel").innerHTML = errorState(err.message);
  }
})();
</script>
</body>
</html>
